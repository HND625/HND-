
name: HND Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p android-project
            unzip -q "$ZIP_FILE" -d android-project
          fi

          GRADLEW=$(find . -name gradlew -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HND-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
